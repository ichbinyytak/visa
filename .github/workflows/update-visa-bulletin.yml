name: Update Visa Bulletin Data

on:
  schedule:
    - cron: '15 14 * * *'
  workflow_dispatch:
    inputs:
      year:
        description: 'Bulletin year, for example 2026'
        required: false
        type: string
      month:
        description: 'Bulletin month, 1-12'
        required: false
        type: string

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Fetch bulletin data
        run: |
          if [ -n "${{ inputs.year }}" ] && [ -n "${{ inputs.month }}" ]; then
            npm run update-bulletin -- "${{ inputs.year }}" "${{ inputs.month }}"
          else
            npm run update-bulletin
          fi

      - name: Commit new data
        run: |
          if git diff --quiet -- data/visa-bulletins; then
            echo "No data changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/visa-bulletins
          git commit -m "Update visa bulletin data"
          git push
