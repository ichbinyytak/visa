<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>美国移民排期查询 - Visa Bulletin</title>
  <style>
    :root {
      --bg: #f6f8fb;
      --panel: #ffffff;
      --line: rgba(40, 66, 92, 0.12);
      --text: #17324a;
      --muted: #64748b;
      --accent: #0f766e;
      --accent-soft: rgba(15, 118, 110, 0.12);
      --accent-2: #c2410c;
      --shadow: 0 10px 28px rgba(23, 50, 74, 0.08);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
      background: var(--bg);
      min-height: 100vh;
      color: var(--text);
    }
    
    .container {
      max-width: 1240px;
      margin: 0 auto;
      padding: 28px 20px 48px;
    }
    
    header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 24px;
      padding: 4px 4px 22px;
      border-bottom: 1px solid var(--line);
    }

    .header-main {
      max-width: 680px;
    }

    .eyebrow {
      margin-bottom: 8px;
      color: var(--accent);
      font-size: 0.86rem;
      font-weight: 750;
    }
    
    header h1 {
      font-size: 2rem;
      font-weight: 760;
      letter-spacing: 0;
      color: var(--text);
      margin-bottom: 8px;
    }
    
    header p {
      color: var(--muted);
      font-size: 0.98rem;
      line-height: 1.6;
    }

    .header-meta {
      display: grid;
      gap: 8px;
      min-width: 250px;
      padding-top: 4px;
    }

    .meta-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 9px 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      color: var(--text);
      font-size: 0.9rem;
    }

    .meta-label {
      color: var(--muted);
      white-space: nowrap;
    }

    .meta-value {
      font-weight: 700;
      text-align: right;
    }
    
    .controls {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 16px;
      margin: 18px 0 24px;
      padding: 18px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: var(--shadow);
    }
    
    .control-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    
    .control-group label {
      font-size: 0.92rem;
      color: var(--muted);
      font-weight: 600;
    }

    .control-group label::after {
      content: '';
      display: block;
      width: 22px;
      height: 2px;
      margin-top: 5px;
      border-radius: 999px;
      background: var(--accent);
      opacity: 0.45;
    }
    
    select {
      padding: 14px 16px;
      font-size: 1rem;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      color: var(--text);
      cursor: pointer;
      min-width: 0;
      transition: all 0.3s ease;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.8);
    }
    
    select:hover {
      border-color: rgba(15, 118, 110, 0.35);
    }
    
    select:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 4px rgba(15, 118, 110, 0.12);
    }
    
    .loading {
      text-align: center;
      padding: 72px 24px;
      font-size: 1.2rem;
      color: var(--muted);
      background: var(--panel);
      border-radius: 8px;
      border: 1px solid var(--line);
      box-shadow: var(--shadow);
    }
    
    .loading::after {
      content: '';
      display: inline-block;
      width: 20px;
      height: 20px;
      border: 3px solid var(--accent);
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-left: 10px;
      vertical-align: middle;
    }
    
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    
    .error {
      background: rgba(220, 38, 38, 0.08);
      border: 1px solid rgba(220, 38, 38, 0.2);
      border-radius: 20px;
      padding: 24px;
      text-align: center;
      color: #b91c1c;
      margin-bottom: 30px;
      box-shadow: var(--shadow);
    }
    
    .results-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 18px;
      margin-bottom: 18px;
      padding: 0 4px;
    }

    .results-meta {
      display: flex;
      flex-direction: column;
      gap: 8px;
      align-items: flex-start;
    }

    .source-link {
      color: var(--accent);
      font-size: 0.86rem;
      font-weight: 600;
      text-decoration: none;
    }

    .source-link:hover {
      text-decoration: underline;
    }

    .results-summary h2 {
      font-size: 1.4rem;
      margin-bottom: 6px;
      color: var(--text);
    }

    .results-summary p {
      color: var(--muted);
      line-height: 1.6;
    }
    
    .tables-container {
      display: grid;
      gap: 22px;
    }
    
    .table-section {
      background: var(--panel);
      border-radius: 8px;
      padding: 20px;
      border: 1px solid var(--line);
      box-shadow: var(--shadow);
    }
    
    .section-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 18px;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--line);
    }

    .section-heading h3 {
      font-size: 1.1rem;
      color: var(--text);
    }

    .table-description {
      max-width: 780px;
      margin-top: 6px;
      color: var(--muted);
      font-size: 0.88rem;
      line-height: 1.55;
    }

    .section-heading span {
      font-size: 0.85rem;
      color: var(--accent-2);
      background: rgba(194, 65, 12, 0.1);
      padding: 6px 10px;
      border-radius: 999px;
      white-space: nowrap;
    }
    
    .table-wrapper {
      overflow-x: auto;
      border-radius: 8px;
      border: 1px solid rgba(15, 23, 42, 0.06);
      background: rgba(255, 255, 255, 0.72);
    }
    
    .bulletin-table {
      width: 100%;
      border-collapse: separate;
      border-spacing: 0;
      min-width: 720px;
    }
    
    th, td {
      padding: 14px 14px;
      text-align: left;
      border-bottom: 1px solid rgba(15, 23, 42, 0.06);
      vertical-align: top;
    }
    
    th {
      position: sticky;
      top: 0;
      background: #f7fafc;
      color: var(--text);
      font-weight: 600;
      white-space: normal;
      line-height: 1.5;
      z-index: 1;
    }
    
    th:first-child {
      border-radius: 8px 0 0 0;
    }
    
    th:last-child {
      border-radius: 0 8px 0 0;
    }
    
    tr:hover {
      background: rgba(15, 118, 110, 0.04);
    }
    
    td {
      color: var(--text);
      line-height: 1.55;
      word-break: break-word;
    }

    .cell-content {
      display: inline-flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 3px;
      min-width: 0;
    }

    .cell-value {
      min-width: 0;
    }

    .delta {
      display: inline-flex;
      align-items: center;
      padding: 2px 6px;
      border-radius: 999px;
      font-size: 0.74rem;
      font-weight: 650;
      line-height: 1.35;
      white-space: nowrap;
    }

    .delta-advance {
      color: #047857;
      background: rgba(4, 120, 87, 0.1);
    }

    .delta-retrogress {
      color: #b91c1c;
      background: rgba(185, 28, 28, 0.1);
    }

    .delta-neutral {
      color: var(--muted);
      background: rgba(100, 116, 139, 0.12);
    }
    
    .current-date {
      background: var(--accent-soft);
      color: var(--accent);
      padding: 10px 14px;
      border-radius: 999px;
      display: inline-block;
      font-weight: 700;
      white-space: nowrap;
    }
    
    .no-data {
      text-align: center;
      padding: 52px 24px;
      color: var(--muted);
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: var(--shadow);
    }
    
    footer {
      text-align: center;
      padding: 36px 0 0;
      color: var(--muted);
      font-size: 0.9rem;
    }
    
    footer a {
      color: var(--accent);
      text-decoration: none;
      font-weight: 650;
    }

    footer a:hover {
      text-decoration: underline;
    }

    .footer-links {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 10px 18px;
      margin-bottom: 10px;
    }
    
    @media (max-width: 768px) {
      .container {
        padding: 20px 14px 40px;
      }

      header {
        display: grid;
        gap: 16px;
        padding-bottom: 18px;
      }

      .header-main {
        max-width: none;
      }

      .header-meta {
        min-width: 0;
      }

      header h1 {
        font-size: 1.8rem;
      }

      .controls {
        grid-template-columns: 1fr;
        padding: 18px;
        gap: 16px;
      }
      
      .results-head {
        flex-direction: column;
        align-items: flex-start;
      }

      select {
        width: 100%;
      }

      .table-section {
        padding: 18px;
      }

      .section-heading {
        flex-direction: column;
        align-items: flex-start;
      }

      .table-wrapper {
        overflow: visible;
        border: none;
        background: transparent;
      }

      .bulletin-table {
        min-width: 0;
      }

      .bulletin-table thead {
        display: none;
      }

      .bulletin-table tbody {
        display: grid;
        gap: 14px;
      }

      .bulletin-table tr {
        display: block;
        padding: 14px;
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.88);
        border: 1px solid rgba(15, 23, 42, 0.06);
      }

      .bulletin-table td {
        display: grid;
        grid-template-columns: minmax(88px, 108px) 1fr;
        gap: 12px;
        padding: 10px 0;
      }

      .bulletin-table td::before {
        content: attr(data-label);
        color: var(--muted);
        font-size: 0.82rem;
        font-weight: 700;
      }

      .bulletin-table td:last-child {
        border-bottom: none;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="header-main">
        <div class="eyebrow">U.S. Visa Bulletin</div>
        <h1>美国移民排期查询</h1>
        <p>选择年份、月份和类别，查看亲属移民或职业移民排期。日期下方会显示较上月前进、倒退或持平的天数。</p>
      </div>
      <div class="header-meta" aria-label="数据概览">
        <div class="meta-item">
          <span class="meta-label">数据范围</span>
          <span class="meta-value">2001-12 至 2026-06</span>
        </div>
        <div class="meta-item">
          <span class="meta-label">数据来源</span>
          <span class="meta-value">travel.state.gov</span>
        </div>
      </div>
    </header>
    
    <div class="controls">
      <div class="control-group">
        <label for="yearSelect">年份</label>
        <select id="yearSelect"></select>
      </div>
      <div class="control-group">
        <label for="monthSelect">月份</label>
        <select id="monthSelect"></select>
      </div>
      <div class="control-group">
        <label for="categorySelect">类别</label>
        <select id="categorySelect">
          <option value="family">亲属移民 (Family-Based)</option>
          <option value="employment">职业移民 (Employment-Based)</option>
        </select>
      </div>
    </div>
    <div id="content">
      <div class="loading">正在加载数据...</div>
    </div>
    
    <footer>
      <div class="footer-links">
        <a href="https://github.com/ichbinyytak/visa" target="_blank" rel="noopener">项目地址</a>
        <a href="https://github.com/ichbinyytak" target="_blank" rel="noopener">GitHub 主页</a>
      </div>
      <p>数据来源：U.S. Department of State Visa Bulletin。本工具仅供参考。</p>
    </footer>
  </div>
  
  <script type="module" src="/src/main.js"></script>
</body>
</html>
